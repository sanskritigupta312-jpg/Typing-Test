<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProType — Reset Password</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <main class="hero">
        <div class="container">
            <header class="logo">ProType</header>
            <h1 class="title">Reset</h1>
            <p class="subtitle">Enter your email and a new password.</p>

            <form id="reset-form">
                <input type="email" id="reset-email" placeholder="Registered Email" required>
                <input type="password" id="new-password" placeholder="New Password" required>
                <button type="submit" class="btn primary">Update Password</button>
            </form>

            <div class="extra-links">
                <a href="login.html" class="about">Back to Login</a>
            </div>
        </div>
    </main>
    <script src="reset-password.js"></script>
</body>
</html>
