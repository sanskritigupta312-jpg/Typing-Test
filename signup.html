<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Sanskriti Kumari">
    <meta name="description" content="ProType - A student development project for practicing web development skills. This is a non-commercial demo site.">
    <title>ProType — Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div style="background: #7c5cff; color: #fff; text-align: center; padding: 8px; font-size: 13px; font-family: 'Inter', sans-serif;">
       <strong>DEVELOPER DEMO:</strong> This is a portfolio project by Sanskriti Kumari (Kalinga University). No real data is stored externally.
    </div>
    <main class="hero">
        <div class="container">
            <header class="logo">ProType</header>
            <h1 class="title">Sign Up</h1>
            <p class="subtitle">Join now to save results and track progress.</p>

            <form id="signup-form">
                <input type="text" id="username" placeholder="Choose a Display Name" required>
                <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                <input type="password" id="password" placeholder="Choose a Password" required autocomplete="new-password">
                <button type="submit" class="btn primary">Create Account</button>
            </form>

            <div class="extra-links">
                <a href="login.html" class="about">Already have an account? Login here.</a>
            </div>
        </div>
        <footer class="credit">Made with ♥</footer>
    </main>
    <script src="signup.js"></script>
</body>
</html>
