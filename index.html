<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProType — Welcome</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="hero">
        <div class="container">
            <header class="logo">ProType</header>
            <h1 class="title">Welcome to ProType</h1>
            <p class="subtitle">A lightweight typing speed test. Sharpen accuracy, track progress, and beat high scores.</p>

            <div class="actions">
                <a class="btn primary" href="home.html" id="enter-site-btn">Enter Site as Guest</a>
                
                <div class="actions-row">
                    <a class="btn secondary" href="login.html">Login</a>
                    <a class="btn secondary" href="signup.html">Sign Up</a>
                </div>
            </div>

            <p class="about" style="margin-top: 20px;">
                Log in to save results and track long-term progress.
            </p>
        </div>
        <footer class="credit">Made with ♥</footer>
    </main>

    <script>
        const sound = new Audio('click.mp3');
        sound.volume = 0.5;

        document.getElementById('enter-site-btn').addEventListener('click', function(e) {
            e.preventDefault(); 
            sound.play().catch(() => {});
            localStorage.setItem('sessionStatus', 'guest');
            localStorage.removeItem('userName');
            setTimeout(() => { window.location.href = 'home.html'; }, 150);
        });
    </script>
</body>
</html>
