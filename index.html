<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Sanskriti Kumari">
    <meta name="description" content="ProType - A student development project for practicing web development skills. This is a non-commercial demo site.">
    <title>ProType — Welcome</title>
    <link rel="stylesheet" href="signup.css">
    <meta name="google-site-verification" content="ETdrHg9pW4AuflEIVq9AmMlw1rEXdGMZ3dfVrWkWQ5c" />
</head>
<body>
    <main class="hero">
        <div class="container">
            <header class="logo">ProType</header>
            <h1 class="title">Welcome to ProType</h1>
            <p class="subtitle">A lightweight typing speed test. Sharpen accuracy, track progress, and beat high scores.</p>

            <div class="actions">
                <a class="btn primary" href="home.html" id="enter-site-btn">Start Typing Now</a>
                
                <div class="actions-row">
                    <a class="btn secondary" href="login.html">Login</a>
                    <a class="btn secondary" href="signup.html">Sign Up</a>
                </div>
            </div>

            <p class="about" style="margin-top: 20px;">
                Log in to save results and track long-term progress.
            </p>
        </div>
        <footer class="credit" style="margin-top: 20px; text-align: center; color: #64748b; font-size: 14px;">
           Developed by <a href="https://github.com/your-username" style="color: #7c5cff; text-decoration: none; font-weight: 600;">Sanskriti Kumari</a> | CS Engineering Student Project
        </footer>
    </main>

    <script>
        const sound = new Audio('click.mp3');
        sound.volume = 0.5;

        document.getElementById('enter-site-btn').addEventListener('click', function(e) {
            e.preventDefault(); 
            sound.play().catch(() => {});
            localStorage.setItem('sessionStatus', 'guest');
            localStorage.removeItem('userName');
            setTimeout(() => { window.location.href = 'home.html'; }, 150);
        });
    </script>
</body>
</html>
