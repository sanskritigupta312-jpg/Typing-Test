<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <div style="background: #7c5cff; color: #fff; text-align: center; padding: 8px; font-size: 13px; font-family: 'Inter', sans-serif;">
       <strong>DEVELOPER DEMO:</strong> This is a portfolio project by Sanskriti Kumari (Kalinga University). No real data is stored externally.

    <main class="hero">
        <div class="container">
            <header class="logo">ProType</header>
            <h1 class="title">Log In</h1>
            <p class="subtitle">Access your account to track progress.</p>

            <form id="login-form">
                <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit" class="btn primary">Login</button>
            </form>

            <div class="extra-links">
                <a href="signup.html" class="about">Don't have an account? Sign up.</a>
                <br>
                <a href="reset-password.html" class="about" style="color: #ff4757;">Forgot Password? Reset here.</a>
            </div>
        </div>
        <footer class="credit">Made with ♥</footer>
    </main>
    <script src="login.js"></script>
</body>
</html>
